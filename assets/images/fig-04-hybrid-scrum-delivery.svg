<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Disciplined Hybrid Delivery Model Proyek OMNI: Predictive Stage-Gates dan Agile Scrum Engine">
  <defs>
    <style>
      .bg { fill: #faf8f4; }
      .title { font: 800 30px "Segoe UI", system-ui, sans-serif; fill: #0f2540; letter-spacing: 0.6px; }
      .sub { font: 600 15px "Segoe UI", system-ui, sans-serif; fill: #526071; }
      .hdr { font: 800 18px "Segoe UI", system-ui, sans-serif; fill: #ffffff; text-anchor: middle; }
      .hdr-dark { font: 800 18px "Segoe UI", system-ui, sans-serif; fill: #0f2540; text-anchor: middle; }
      .body-txt { font: 700 14px "Segoe UI", system-ui, sans-serif; fill: #0f2540; text-anchor: middle; }
      .small { font: 600 13px "Segoe UI", system-ui, sans-serif; fill: #334155; text-anchor: middle; }
      .pill { font: 800 12px "Segoe UI", system-ui, sans-serif; fill: #ffffff; text-anchor: middle; }
    </style>
    <marker id="arrowNavy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0f2540"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1280" height="720" class="bg"/>
  <text x="640" y="68" text-anchor="middle" class="title">DISCIPLINED HYBRID DELIVERY — PROYEK OMNI</text>
  <text x="640" y="98" text-anchor="middle" class="sub">Predictive Stage-Gates (Tata Kelola, Kontrak &amp; Rollout) + Agile Scrum Core (14 Sprint × 2 Minggu)</text>

  <!-- PHASE 1: PREDICTIVE GATE 1 -->
  <rect x="46" y="138" width="252" height="474" rx="16" fill="#ffffff" stroke="#0f2540" stroke-width="2.5"/>
  <rect x="46" y="138" width="252" height="58" rx="14" fill="#0f2540"/>
  <rect x="46" y="176" width="252" height="20" fill="#0f2540"/>
  <text x="172" y="174" class="hdr">GATE 1: PREDICTIVE</text>
  <text x="172" y="224" class="small">Jun – Agu 2026 (M0–M2)</text>

  <rect x="72" y="248" width="200" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="172" y="275" class="body-txt">PROJECT CHARTER</text>
  <text x="172" y="296" class="small">BAC Rp 9,20 M Disetujui</text>

  <rect x="72" y="330" width="200" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="172" y="357" class="body-txt">CONTRACT &amp; SCOPE</text>
  <text x="172" y="378" class="small">PT NDS Rp 4,40 M + Swap</text>

  <rect x="72" y="412" width="200" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="172" y="439" class="body-txt">ARCHITECTURE &amp; WBS</text>
  <text x="172" y="460" class="small">Cloud Jakarta &amp; UU PDP</text>

  <rect x="88" y="510" width="168" height="36" rx="18" fill="#8c2f1b"/>
  <text x="172" y="533" class="pill">STAGE-GATE 1 SIGN-OFF</text>

  <!-- Arrow 1->2 -->
  <line x1="298" y1="375" x2="342" y2="375" stroke="#0f2540" stroke-width="4" marker-end="url(#arrowNavy)"/>

  <!-- PHASE 2: AGILE SCRUM ENGINE -->
  <rect x="352" y="138" width="568" height="474" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <rect x="352" y="138" width="568" height="58" rx="14" fill="#0f766e"/>
  <rect x="352" y="176" width="568" height="20" fill="#0f766e"/>
  <text x="636" y="174" class="hdr">AGILE SCRUM ENGINE (14 SPRINT • 560 SP)</text>
  <text x="636" y="224" class="small">Sep 2026 – Apr 2027 • 3 Release Increments (M3–M5)</text>

  <!-- Backlog Stack -->
  <rect x="378" y="268" width="132" height="210" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="444" y="298" class="body-txt">PRODUCT</text>
  <text x="444" y="317" class="body-txt">BACKLOG</text>
  <rect x="394" y="336" width="100" height="24" rx="5" fill="#0f766e"/>
  <text x="444" y="352" class="pill">R1: OMS MVP</text>
  <rect x="394" y="370" width="100" height="24" rx="5" fill="#0f2540"/>
  <text x="444" y="386" class="pill">R2: App/Pay</text>
  <rect x="394" y="404" width="100" height="24" rx="5" fill="#d97706"/>
  <text x="444" y="420" class="pill">R3: BOPIS</text>
  <text x="444" y="458" class="small">PO: Kevin Halim</text>

  <!-- Arrow Backlog -> Sprint Loop -->
  <line x1="510" y1="373" x2="546" y2="373" stroke="#0f766e" stroke-width="3.5" marker-end="url(#arrowTeal)"/>

  <!-- Central Sprint Circle -->
  <circle cx="652" cy="373" r="96" fill="#fffbeb" stroke="#d97706" stroke-width="10" stroke-dasharray="260 28"/>
  <circle cx="652" cy="373" r="68" fill="#ffffff" stroke="#e2dcd0" stroke-width="2"/>
  <text x="652" y="358" class="hdr-dark">SPRINT</text>
  <text x="652" y="382" class="body-txt" fill="#8c2f1b">2 WEEKS</text>
  <text x="652" y="404" class="small">Plan • Build • Test</text>

  <!-- Daily Scrum mini-loop -->
  <circle cx="718" cy="285" r="32" fill="#0f2540" stroke="#faf8f4" stroke-width="4"/>
  <text x="718" y="282" class="pill">DAILY</text>
  <text x="718" y="297" class="pill">15m</text>

  <!-- Review & Retro badges -->
  <rect x="556" y="492" width="192" height="32" rx="16" fill="#0f766e"/>
  <text x="652" y="513" class="pill">SPRINT REVIEW &amp; RETRO</text>
  <text x="652" y="550" class="small">Scope Swap Guardrail • DoD UU PDP</text>

  <!-- Arrow Sprint -> Increment -->
  <line x1="748" y1="373" x2="778" y2="373" stroke="#0f766e" stroke-width="3.5" marker-end="url(#arrowTeal)"/>

  <!-- Increment Box -->
  <rect x="786" y="296" width="112" height="154" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="842" y="336" class="body-txt">TESTED</text>
  <text x="842" y="356" class="body-txt">INCREMENT</text>
  <text x="842" y="388" class="small">Done &amp;</text>
  <text x="842" y="406" class="small">Shippable</text>
  <text x="842" y="432" class="small">R1 → R2 → R3</text>

  <!-- Arrow 2->3 -->
  <line x1="920" y1="375" x2="964" y2="375" stroke="#0f2540" stroke-width="4" marker-end="url(#arrowNavy)"/>

  <!-- PHASE 3: PREDICTIVE WAVE ROLLOUT -->
  <rect x="974" y="138" width="260" height="474" rx="16" fill="#ffffff" stroke="#8c2f1b" stroke-width="2.5"/>
  <rect x="974" y="138" width="260" height="58" rx="14" fill="#8c2f1b"/>
  <rect x="974" y="176" width="260" height="20" fill="#8c2f1b"/>
  <text x="1104" y="174" class="hdr">GATE 2–4: ROLLOUT</text>
  <text x="1104" y="224" class="small">Mei – 26 Nov 2027 (M6–M8)</text>

  <!-- Stepping Rollout Bars -->
  <rect x="1002" y="252" width="204" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="1104" y="277" class="body-txt">SIT / UAT &amp; PILOT</text>
  <text x="1104" y="298" class="small">10 Toko • 2.500 TPM • Gate 3</text>

  <rect x="1002" y="330" width="204" height="58" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
  <text x="1104" y="355" class="body-txt">WAVE ROLLOUT 1–3</text>
  <text x="1104" y="376" class="small">30 → 40 → 40 (120 Toko)</text>

  <rect x="1002" y="408" width="204" height="66" rx="10" fill="#0f2540"/>
  <text x="1104" y="436" class="hdr">GO-LIVE NASIONAL</text>
  <text x="1104" y="458" class="pill" fill="#fbbf24">26 NOVEMBER 2027 (M8)</text>

  <rect x="1020" y="510" width="168" height="36" rx="18" fill="#0f766e"/>
  <text x="1104" y="533" class="pill">HYPERCARE &amp; CLOSURE</text>

  <!-- Bottom Governance Rail -->
  <rect x="46" y="636" width="1188" height="44" rx="10" fill="#0f2540"/>
  <text x="640" y="663" class="pill" style="font-size:14px; letter-spacing:0.6px;">CONTINUOUS HYBRID GOVERNANCE: SENIOR PM (FAJAR) • STEERING COMMITTEE • EVM &amp; VELOCITY TRACKING • CHANGE CONTROL</text>
</svg>
